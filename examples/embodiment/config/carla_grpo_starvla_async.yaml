# CARLA GRPO with async rollout; env keys are in config/env/carla.yaml.
# Differs from carla_grpo_starvla.yaml ONLY in the two async knobs marked below and the experiment name;
# every hyperparameter that could move a throughput number is deliberately identical (the A/B control).

defaults:
  - env/carla@env.train
  - env/carla@env.eval
  - model/starvla@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # servers per card == group_size (RLinf repeats one reset id per env process), so 4 env cards give 16 servers.
  component_placement:
    actor: 4-7
    rollout: 4-7
    env: 0-3

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: "${oc.env:CARLA_OUTPUT_DIR}/carla_grpo_async"
    project_name: "streaming-vla"
    experiment_name: "carla-grpo-starvla-qwen3vl2b-async"
    # wandb runs OFFLINE: GPU nodes have no route out, so a networked init would block, not fail.
    logger_backends: ["tensorboard", "wandb"]
  # max_epochs and max_steps are a min(), not alternatives -- max_epochs is the one that binds.
  max_epochs: 5
  # 5 updates: step 1 is polluted by load; steps 2-5 are the steady state being measured.
  max_steps: 5
  only_eval: false
  # -1 disables eval: eval is 4 more CARLA servers competing for the same 4 env cards.
  val_check_interval: -1
  # 25, not 5: the overnight run ends on its own timeout, so this caps lost work at ~25 steps.
  save_interval: 25
  resume_dir: null
  ckpt_path: null
  # use_training_pipeline is deliberately absent (false): on, the env worker hits config.py's adv_type == "gae".

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  # 4 is GRPO's floor, so 4 servers per env card; batch sizes must keep whole groups per actor rank.
  group_size: 4
  # ASYNC KNOB 1. Off-policy bound in updates; required -- the actor .get()s it and does arithmetic with it.
  staleness_threshold: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  # Plain grpo, NOT grpo_dynamic: the dynamic variant needs multi-turn plumbing this run lacks.
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.001
  entropy_bonus: 0
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  # false: enable_offload unloads the SIMULATOR, and a CARLA world cannot be saved or restarted cheaply.
  enable_offload: false
  train:
    rollout_epoch: 1
    # 16: total_num_envs // env_world_size (4) // 1 must be a multiple of group_size 4.
    total_num_envs: 16
    # false is required: with auto_reset loss_mask is None (TypeError), and dones[k+1] maps to tick k.
    auto_reset: false
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    # 498 = 6*83: validate_embodied_cfg requires a multiple of actor.model.num_action_chunks.
    max_episode_steps: 498
    max_steps_per_rollout_epoch: 498
    specific_reset_id: 0
    video_cfg:
      save_video: false
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 498
    max_steps_per_rollout_epoch: 498
    group_size: 1
    is_eval: true
    specific_reset_id: 0
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    # The MLP head draws from Normal(mean, exp(logstd)); off, a group's members are identical.
    do_sample: true
    temperature_train: 0.3
    temperature_eval: 0.3
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: 256
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: false
  unnorm_key: ${actor.model.unnorm_key}
  enable_offload: false
  pipeline_stage_num: 1
  model:
    # Point at the .pt, not the run dir: sorted(files)[-1] is lexicographic and loads wrong weights.
    model_path: ${oc.env:CARLA_SFT_CHECKPOINT}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # ASYNC KNOB 2. Issue the weight sync and return; validate_embodied_cfg requires weight_syncer.type=patch.
  sync_weight_no_wait: true
  # validate_reasoning_cfg never runs for embodied, so these are used as written: 16 = the 16 envs' trajectories.
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42
  # false: env 0-3 and actor 4-7 share no card, so offload only adds a CPU round trip per phase.
  enable_offload: false
  model:
    model_path: ${rollout.model.model_path}
    action_dim: 3
    num_action_chunks: 6
    # "new_embodiment" from the SFT statistics; a wrong key raises instead of skipping unnorm.
    unnorm_key: new_embodiment
    add_value_head: false
    action_stats_source: "minmax"
    # true because full finetune did not fit; safe because the SFT adapters were merged (zero-init B).
    is_lora: true
    # RLinf's list minus "proj": peft suffix-matches, so it catches Qwen-VL's Conv3d and dies.
    # RLinf reads this override in get_model; the default list remains unchanged.
    lora_target_modules:
      - "qkv"
      - "fc1"
      - "fc2"
      - "q"
      - "kv"
      - "fc3"
      - "out_proj"
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
      - "lm_head"
    starvla:
      framework_name: "QwenOFT"
      expected_action_dim: ${actor.model.action_dim}
      expected_num_action_chunks: ${actor.model.num_action_chunks}
      # Must be false: the state path puts the state (incl. our 3-dim action) into the prompt.
      enable_state_input: false
      # 640x360, matching the SFT data and the checkpoint's datasets.vla_data.image_size.
      expected_image_size: [640, 360]
  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-5
    weight_decay: 0.01
    clip_grad: 2.0
  fsdp_config:
    strategy: "fsdp2"
    sharding_strategy: "full_shard"
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    wrap_policy:
      # Must be exact transformers class names; a mismatch silently wraps nothing, then OOMs.
      transformer_layer_cls_to_wrap:
        - Qwen3VLTextDecoderLayer
        - Qwen3VLVisionBlock
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
