[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-alpamayo-compat"
version = "0.1.0"
requires-python = ">=3.11"
license = {file = "LICENSE"}
description = "Checkpoint-compatible Alpamayo model and observation processing"

[tool.setuptools.packages.find]
where = ["."]
include = ["autopilot*"]
